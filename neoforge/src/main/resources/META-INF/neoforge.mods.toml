type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "waystones"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
